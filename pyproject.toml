# 项目元数据（TD-25: 添加 pyproject.toml）
[project]
name = "acp-cc-practice"
version = "1.2.1"  # 单一来源；acp-cc-practice.spec 的 FileVersion/ProductVersion 与此对齐
description = "ACP CC 题库练习软件"
requires-python = ">=3.10"
dependencies = [
    # 50.0.0 起：PYSEC-2026-3552（pip-audit P7 门禁），49.x 及以下不收
    "cryptography>=50.0.0,<51",
    # 仅 Essentials 核心（QtCore/QtGui/QtWidgets）：本应用不用 WebEngine/Pdf/Addons，
    # PySide6 元包 6.12 起连带拉 ~700MB 无关组件；shiboken6 由 Essentials 自动带入
    "PySide6-Essentials>=6.12.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0,<10.0",
    "pytest-cov>=4.0.0,<7.0",
    "pytest-qt>=4.5.0,<5.0",
    "mypy>=2.0.0,<3.0",
    "ruff>=0.4.0,<1.0",
    # pre-push 钩子与 CI 的 bandit 扫描（原先只装在系统 PATH，未进 lock）
    "bandit>=1.7,<2.0",
]
release = [
    "pyinstaller>=6.0,<7.0",
    "sigstore>=3.0,<4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# 显式包发现：平铺布局下自动发现会撞上 data/ icons/ 等非包目录
# （Multiple top-level packages discovered），限定真实 Python 包
[tool.setuptools.packages.find]
include = ["ui*", "license*"]

# TD-17: pytest 配置
# P6 迁移后 GUI 测试经 QT_QPA_PLATFORM=offscreen 无头运行，不再默认跳过；
# gui 标记保留用于筛选（pytest -m gui 单独运行 UI 用例）。
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "gui: GUI（Qt widgets）测试，可用 -m gui 单独运行",
    "slow: 运行较慢的测试",
]

# TD-18: 覆盖率配置
# 2026-10-19 审核修复：原 source 只含 quiz_engine/data_manager/license 三个
# 92% 已达标模块，ui/app_state/main 这些真实短板（27%~59%）不在度量范围，
# --cov-fail-under=70 形同虚设；扩为全部生产模块（实测 TOTAL 85%）。
[tool.coverage.run]
source = ["quiz_engine", "data_manager", "license", "ui", "app_state", "main", "models", "logging_utils"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ = .__main__.:",
    "pass",
]
show_missing = true

# TD-28: mypy 类型检查配置
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
show_error_codes = true
exclude = ["build", "dist", "tests", "scripts"]

# TD-32: ruff 自动化格式化与静态检查
[tool.ruff]
target-version = "py310"
line-length = 100
# vendored 门禁脚本：由 global-rules skill 分发、哈希被 RULES_MANIFEST 跟踪，
# 禁本地格式化/改写（会触发 RULES_COPY_DRIFT），lint 归上游 skill 负责
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "S", "B", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"author_tools/*" = ["E402"]
"tests/*" = ["E402", "S101", "S108", "B017"]
# PowerShell 经 PATH 调用是 Windows 惯例（fingerprint 采集 BIOS 序列号）
"license/fingerprint.py" = ["S607"]

# assert 仅用于 mypy 类型收窄（紧邻创建后的不变量断言），禁止用作运行时校验（L1）
"ui/exam_panel.py" = ["S101"]
"ui/exam_report_dialog.py" = ["S101"]
"ui/license_dialog.py" = ["S101"]

# bandit（pre-push 钩子）
# B101：assert 仅用于 mypy 类型收窄，禁止用作运行时校验（L1，同 ruff S101）
# B110：来自 vendored 门禁脚本（RULES_MANIFEST 跟踪哈希，禁改）
# B404/B603/B607：fingerprint.py 的 PowerShell CIM 采集（固定参数、不走 shell、5s 超时），
#                 bandit 对 list 参数 subprocess 的低危噪音，非本项目威胁模型
[tool.bandit]
skips = ["B101", "B110", "B404", "B603", "B607"]
exclude_dirs = ["tests", "dist", "build"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
