name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller sigstore

      - name: Build EXE
        run: pyinstaller acp-cc-practice.spec --noconfirm --clean

      # TD-23: 使用 Sigstore 对 EXE 进行无密钥签名
      # sigstore-python 默认生成 .sigstore.json bundle（含签名与证书）
      - name: Sign EXE with Sigstore
        # v3.0.0 在 TUF 根证书轮换后验签失败（root was signed by 0/3 keys），升级修复
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: ./dist/acp-cc-practice.exe

      - name: List dist artifacts
        shell: pwsh
        run: Get-ChildItem -Path dist/ | Select-Object Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: acp-cc-practice-${{ github.ref_name }}
          path: ./dist/acp-cc-practice.exe*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/acp-cc-practice.exe*
          generate_release_notes: true
