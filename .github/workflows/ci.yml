name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # PySide6 测试由 tests/unit/conftest.py 顶层设 QT_QPA_PLATFORM=offscreen，
  # 理论上无需显示服务；DISPLAY + Xvfb 仅作兜底，防个别 Qt 插件回退到 xcb 时崩溃
  DISPLAY: ":99"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils libegl1 libgl1 libxkbcommon0

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1024x768x24 > /tmp/xvfb.log 2>&1 &
          echo "XVFB_PID=$!" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # dev 工具经 requirements.lock 精确锁定安装（H8：原先 pip install 最新版
          # 与本机 lock 脱节，CI 不可复现）；运行依赖 -e . 从 pyproject 装保证包发现
          pip install -r requirements.lock
          pip install -e . --no-deps
          pip install pip-audit
          # runner 预装 setuptools 含已知 CVE（PYSEC-2026-3447，fix 83.0.0）；
          # 它是构建引导件、不在 lock 内，升级后过 pip-audit
          pip install "setuptools>=83.0.0"

      - name: Ruff check
        run: ruff check .

      - name: Mypy type check
        run: mypy --disallow-untyped-defs .
        env:
          MYPYPATH: "."

      # H8：bandit 此前只挂本地 pre-push，绕过钩子即绕过扫描——CI 补第二道
      - name: Bandit security scan
        run: bandit -c pyproject.toml -r .

      # H8：pyproject 声称的 pip-audit CVE 门禁（P7）此前无任何接线
      - name: Pip audit (CVE gate)
        run: pip-audit --skip-editable

      # 本地 pre-commit 之外的第二道安检：防钩子未激活时密钥/依赖锁漏过公开仓库
      # （三个脚本纯标准库，CI 无需额外依赖；3.10 兼容——无 tomllib）
      - name: Check secrets
        run: python scripts/check_secrets.py .

      - name: Check deps lock
        run: python scripts/check_deps_lock.py .

      # H7：门禁存在性自检（此前本脚本自己从未被任何入口调用）
      - name: Check gates present
        run: python scripts/check_gates_present.py .

      # GUI 测试随全量套件在 offscreen 平台运行（conftest.py 顶层设环境变量，
      # 先于任何 QApplication 创建）；覆盖率与测试合并为一步（原先全量跑两遍）
      - name: Pytest with coverage
        run: pytest tests/ -q --tb=short -o addopts="" --cov --cov-fail-under=80

      - name: Stop Xvfb
        if: always()
        run: kill $XVFB_PID || true
