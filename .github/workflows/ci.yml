name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # headless Ubuntu runner 需要虚拟 display；即使 -m "not gui" 意外执行 GUI 测试，
  # 也避免 _tkinter.TclError: no display name and no $DISPLAY environment variable
  DISPLAY: ":99"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1024x768x24 > /tmp/xvfb.log 2>&1 &
          echo "XVFB_PID=$!" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # 运行依赖经 -e . 从 pyproject.toml 安装（单一来源，
          # 避免硬编码清单与 pyproject 漂移导致 ModuleNotFoundError）
          pip install -e . mypy ruff pytest pytest-cov

      - name: Ruff check
        run: ruff check .

      - name: Mypy type check
        run: mypy --disallow-untyped-defs .
        env:
          MYPYPATH: "."

      # 本地 pre-commit 之外的第二道安检：防钩子未激活时密钥/依赖锁漏过公开仓库
      # （两个脚本纯标准库，CI 无需额外依赖；3.10 兼容——无 tomllib）
      - name: Check secrets
        run: python scripts/check_secrets.py .

      - name: Check deps lock
        run: python scripts/check_deps_lock.py .

      # CI 中显式覆盖 pyproject.toml 的 addopts，避免 -m 'not gui' 与命令行 -m "not gui" 冲突
      # 导致 GUI 测试未被正确 deselect（此前只 deselect 了 12 个而非 65 个）
      - name: Pytest (non-GUI)
        run: pytest tests/ -q --tb=short -o addopts="" -m "not gui"

      - name: Coverage
        run: pytest tests/ -q --tb=short -o addopts="" -m "not gui" --cov=quiz_engine --cov=data_manager --cov=license --cov-fail-under=70

      - name: Stop Xvfb
        if: always()
        run: kill $XVFB_PID || true
