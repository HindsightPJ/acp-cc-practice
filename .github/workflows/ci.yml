name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # PySide6 测试由 tests/unit/conftest.py 顶层设 QT_QPA_PLATFORM=offscreen，
  # 理论上无需显示服务；DISPLAY + Xvfb 仅作兜底，防个别 Qt 插件回退到 xcb 时崩溃
  DISPLAY: ":99"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1024x768x24 > /tmp/xvfb.log 2>&1 &
          echo "XVFB_PID=$!" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # 运行依赖经 -e . 从 pyproject.toml 安装（单一来源，
          # 避免硬编码清单与 pyproject 漂移导致 ModuleNotFoundError）
          pip install -e . mypy ruff pytest pytest-cov pytest-qt

      - name: Ruff check
        run: ruff check .

      - name: Mypy type check
        run: mypy --disallow-untyped-defs .
        env:
          MYPYPATH: "."

      # 本地 pre-commit 之外的第二道安检：防钩子未激活时密钥/依赖锁漏过公开仓库
      # （两个脚本纯标准库，CI 无需额外依赖；3.10 兼容——无 tomllib）
      - name: Check secrets
        run: python scripts/check_secrets.py .

      - name: Check deps lock
        run: python scripts/check_deps_lock.py .

      # GUI 测试随全量套件在 offscreen 平台运行（conftest.py 顶层设环境变量，
      # 先于任何 QApplication 创建）；显式置空 addopts 保持 CI 输出可控
      - name: Pytest
        run: pytest tests/ -q --tb=short -o addopts=""

      - name: Coverage
        run: pytest tests/ -q --tb=short -o addopts="" --cov=quiz_engine --cov=data_manager --cov=license --cov-fail-under=70

      - name: Stop Xvfb
        if: always()
        run: kill $XVFB_PID || true
