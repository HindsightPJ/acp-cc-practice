name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy ruff pytest cryptography python-docx

      - name: Ruff check
        run: ruff check .

      - name: Mypy type check
        run: mypy .
        env:
          MYPYPATH: "."

      - name: Pytest (non-GUI)
        run: pytest tests/ -q --tb=short -m "not gui"
